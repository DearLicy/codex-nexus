[package]
name = "codex-nexus"
version = "0.1.0"
edition = "2021"
description = "Provider routing and safe image artifact handling for the Codex third-party tool"
license = "MIT"

[lib]
name = "codex_tool_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
