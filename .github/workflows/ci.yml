name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Rust and Slint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format core and desktop crates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Test core crate
        working-directory: src-tauri
        run: cargo test --locked
      - name: Check native desktop crate
        run: cargo check --locked --manifest-path native/Cargo.toml
      - name: Run gateway and MCP contract tests
        run: node --test tests/**/*.test.mjs
